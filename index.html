<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta id="meta-theme" name="theme-color" content="#c4b5fd" />
  <meta name="description" content="나의 멘탈 세계관 진단 — 데미안에서 영감을 받은 20문항 밸런스 게임" />
  <meta property="og:title" content="알 깨기 테스트 | 나의 멘탈 세계관 진단" />
  <meta property="og:description" content="데미안에서 영감을 받은 20문항 밸런스 게임. 3초 안에 더 끌리는 선택을 고르세요." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://moonjjeong88-art.github.io/safety-zeromi/assets/demian-cover.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <title>알 깨기 테스트 | 나의 멘탈 세계관 진단</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body data-phase="bright">
  <div class="noise" aria-hidden="true"></div>
  <div class="app" id="app">
    <header class="top-bar">
      <span class="logo-mark" aria-hidden="true">✦</span>
      <span class="logo-text">알 깨기 테스트</span>
    </header>

    <main class="main">
      <!-- Landing -->
      <section class="screen screen--landing" id="screen-landing" data-phase="bright">
        <div class="hero-badge">밸런스 게임 · 20문항</div>
        <div class="landing-cover">
          <img
            src="assets/demian-cover.png"
            alt="알 깨기 테스트 커버"
            loading="eager"
            decoding="async"
          />
        </div>
        <h1 class="title">나의 멘탈<br />세계관 진단</h1>
        <p class="subtitle">헤르만 헤세 『데미안』에서 영감을 받은 가벼운 자기 탐색 테스트입니다.</p>
        <div class="guide-card">
          <p class="guide-title">플레이 가이드</p>
          <p class="guide-body">깊게 고민하지 말고 <strong>3초 안에</strong> 더 끌리는 선택지를 터치하세요!</p>
        </div>
        <button type="button" class="btn btn--primary" id="btn-start">시작하기</button>
        <p class="hint">약 2~3분 · 결과 4종 · 공유하기 좋게 만들었었어요</p>
      </section>

      <!-- Quiz -->
      <section class="screen screen--quiz hidden" id="screen-quiz" data-phase="bright" aria-live="polite">
        <div class="quiz-meta">
          <span class="part-label" id="part-label">1부</span>
          <span class="progress" id="progress-text">1 / 20</span>
        </div>
        <div class="progress-bar" role="presentation">
          <div class="progress-bar__fill" id="progress-fill"></div>
        </div>
        <h2 class="question" id="question-text"></h2>
        <div class="choices">
          <button type="button" class="choice choice--a" id="choice-a" data-value="A">
            <span class="choice__tag">A</span>
            <span class="choice__text" id="choice-a-text"></span>
          </button>
          <button type="button" class="choice choice--b" id="choice-b" data-value="B">
            <span class="choice__tag">B</span>
            <span class="choice__text" id="choice-b-text"></span>
          </button>
        </div>
      </section>

      <!-- Result -->
      <section class="screen screen--result hidden" id="screen-result" data-phase="result">
        <div class="result-hero">
          <div class="abraxas-frame" aria-hidden="true">
            <svg class="abraxas-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="currentColor" stop-opacity="0.95" />
                  <stop offset="100%" stop-color="currentColor" stop-opacity="0.35" />
                </linearGradient>
              </defs>
              <g fill="none" stroke="url(#g1)" stroke-width="1.2">
                <circle cx="100" cy="100" r="72" />
                <circle cx="100" cy="100" r="46" />
                <path d="M100 28 L100 172 M28 100 L172 100 M52 52 L148 148 M148 52 L52 148" />
                <polygon points="100,40 128,92 172,92 138,124 152,168 100,138 48,168 62,124 28,92 72,92" />
              </g>
            </svg>
          </div>
          <p class="result-type-num" id="result-type-num"></p>
          <h2 class="result-title" id="result-title"></h2>
          <p class="result-tagline" id="result-tagline"></p>
        </div>

        <article class="result-section">
          <h3 class="result-section__h">내면세계 분석</h3>
          <p class="result-section__p" id="result-inner"></p>
        </article>
        <article class="result-section">
          <h3 class="result-section__h">숨겨진 무의식의 그림자</h3>
          <p class="result-section__p" id="result-shadow"></p>
        </article>
        <article class="result-section result-section--accent">
          <h3 class="result-section__h">당신의 성장 모멘텀</h3>
          <p class="result-section__p" id="result-growth"></p>
        </article>
        <blockquote class="demian-quote" id="result-quote"></blockquote>

        <div class="result-actions">
          <button type="button" class="btn btn--primary" id="btn-retry">다시 하기</button>
          <button type="button" class="btn btn--ghost" id="btn-share">결과 공유</button>
        </div>
        <p class="share-fallback hidden" id="share-fallback">링크를 복사해 주세요. (브라우저가 공유를 지원하지 않습니다)</p>
      </section>
    </main>

    <footer class="footer">
      <small>© 알 깨기 테스트 · 『데미안』 오마주 · 진단이 아닌 놀이입니다</small>
    </footer>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
